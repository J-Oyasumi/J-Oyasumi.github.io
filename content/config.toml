[features]
# Display all subpages on a single page
enable_one_page_mode = false

# Visitor globe at the bottom of the home page (MapMyVisitors; the d= key holds the visit history).
# For a flat map instead, use: https://mapmyvisitors.com/map.js?d=<same key>&w=a&t=tt&co=f7f7f4&cl=d6d8da&ct=555555&cmo=2f5da8&cmn=d2b21a
